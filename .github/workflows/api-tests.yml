name: API Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-html

      - name: Run tests
        env:
          key_id: ${{ secrets.RAZORPAY_KEY_ID }}
          key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: pytest -v --html=report.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html