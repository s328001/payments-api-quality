name: API Tests

on:
  push:
  workflow_dispatch:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-html

      - name: Check secrets are set
        env:
          key_id: ${{ secrets.KEY_ID }}
          key_secret: ${{ secrets.KEY_SECRET }}
        run: python -c "import os; print('key_id set:', bool(os.getenv('key_id'))); print('key_secret set:', bool(os.getenv('key_secret')))"

      - name: Run tests
        env:
          key_id: ${{ secrets.KEY_ID }}
          key_secret: ${{ secrets.KEY_SECRET }}
        run: pytest -v --html=report.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html